<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>Dart Counter</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
</head>
<body>
  <main id="app"></main>

  <script type="module" src="./app.js"></script>

  <!-- Prevent ghost double-taps & stuck :active state on iOS -->
  <script>
    (function () {
      var _busy = false;
      document.addEventListener('touchstart', function (e) {
        var btn = e.target.closest('button');
        if (!btn || btn.disabled) return;
        btn.classList.add('tapped');
        setTimeout(function () { btn.classList.remove('tapped'); }, 120);
      }, { passive: true });

      // Block re-entrant taps while JS is processing a dart throw
      document.addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn) return;
        if (_busy) { e.stopImmediatePropagation(); e.preventDefault(); return; }
        _busy = true;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { _busy = false; });
        });
      }, true);
    })();
  </script>
</body>
</html>
